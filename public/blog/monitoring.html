<style type="text/css" media="screen">
body{
  font-family:system-ui;
  margin:0px;
  padding:0px;
}
h1{
  text-align:center;
  color:#555;
}
h1 img{
  height: 20px;
}
button{
  background-color:#37b;
  color:#fff;
  border:0px none;
  border-radius:3px;
  padding:5px 9px;
}
pre{
  margin: 10px;
  padding: 10px;
  border: 1px dotted #ddd;
  overflow: auto;
}
button.warning{
  background-color:#b33;
}
.views-list{
  margin:30px auto;
  text-align:center;
  border-top:1px dotted #ddd;
}
.views-list div{
  padding:10px;
  clear:both;
  height:33px;
  border-bottom:1px dotted #ddd;
}
.views-list div img{
  border:1px solid #ddd;
  border-radius:2px;
  float:left;
  max-width:50vw;
}
.views-list div button{
  margin-top:5px;
  float:right;
}
.views-rall{
  padding:30px;
  text-align:center;
  border-top:1px dotted #ddd;
  border-bottom:1px dotted #ddd;
}
.views-rall button{
  margin:5px;
}
</style>
<script>
function refresh(id,user,monitor){
  const img=document.getElementById(id);
  if(!img){return;}
  img.onerror=null;
  img.onload=null;
  img.src=greyLoaderImage();
  img.onload=function(){
    this.onerror=null;
    this.onload=null;
    img.src='https://views-olive.vercel.app/?user='+user
      +(monitor?'&monitor=true':'')
      +'&random='+Math.ceil(Math.random()*0xffff)
      +'&register=github.com/9r3i/views/tree/master&color='+[
        0xdd,0xbb,0x11,
      ].join(',');
  };
}
function refreshRandom(id,user,monitor){
  const img=document.getElementById(id);
  if(!img){return;}
  img.onerror=null;
  img.onload=null;
  img.src=greyLoaderImage();
  img.onload=function(){
    this.onerror=null;
    this.onload=null;
    img.src='https://views-olive.vercel.app/?user='+user
      +(monitor?'&monitor=true':'')
      +'&random='+Math.ceil(Math.random()*0xffff)
      +'&register=github.com/9r3i/views/tree/master&color='+[
        Math.ceil(Math.random()*0xff),
        Math.ceil(Math.random()*0xff),
        Math.ceil(Math.random()*0xff),
      ].join(',');
  };
}
function refreshOne(){
  let monitor=this.dataset.monitor?true:false;
  refresh(this.dataset.id,this.dataset.user,monitor);
}
function viewAll(users){
  const res=document.createElement('div');
  res.classList.add('views-list');
  for(let user in users){
    let img=new Image,
    but=document.createElement('button'),
    div=document.createElement('div');
    img.id='views-'+user;
    img.dataset.id='views-'+user;
    img.dataset.user=user;
    img.dataset.monitor='true';
    img.onerror=refreshOne;
    img.src='';
    but.innerText='refresh: '+user;
    but.dataset.id='views-'+user;
    but.dataset.user=user;
    but.dataset.monitor='true';
    but.onclick=refreshOne;
    div.appendChild(img);
    div.appendChild(but);
    res.appendChild(div);
  }
  return res;
}
function refreshAll(users){
  let buts=document.querySelectorAll('button[data-id]'),
  isMonitor=buts[0]&&buts[0].dataset.hasOwnProperty('monitor');
  for(let user in users){
    refresh('views-'+user,user,isMonitor);
  }
}
function refreshPush(){
  let buts=document.querySelectorAll('button[data-id]');
  for(let but of buts){
    if(but.dataset.hasOwnProperty('monitor')){
      delete but.dataset.monitor;
      but.classList.add('warning');
    }else{
      but.dataset.monitor='true';
      but.classList.remove('warning');
    }
  }
}
async function init(){
  document.body.innerHTML='<h1>'
    +'<img src="'+greyLoaderImage()+'" />'
    +' Loading...</h1>';
  let url='https://views-olive.vercel.app/?rusers',
  users=false,
  raw=await fetch(url,{mode:'cors'}).then(r=>r.text()).catch(e=>'false');
  
      try{
        users=JSON.parse(raw);
      }catch(e){}
      return wrap(users,raw);
}
function wrap(users,raw){
  document.body.innerHTML='<h1>Views Monitoring ('
    +Object.keys(users).length+')</h1>';
  vall=viewAll(users);
  document.body.appendChild(vall);
  let ball=document.createElement('button'),
  bx=document.createElement('button'),
  bz=document.createElement('button'),
  bdiv=document.createElement('div'),
  pre=document.createElement('pre');
  bdiv.classList.add('views-rall');
  ball.innerText='refresh: ALL';
  bx.innerText='refresh: USERS';
  bz.innerText='refresh: PUSH';
  ball.onclick=e=>refreshAll(users);
  bx.onclick=init;
  bz.onclick=refreshPush;
  pre.innerText=raw;
  bdiv.appendChild(ball);
  bdiv.appendChild(bx);
  bdiv.appendChild(bz);
  document.body.appendChild(bdiv);
  document.body.appendChild(pre);
}

</script>
