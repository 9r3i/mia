; server
[server]
; directory
private=private
public=public
libdir=lib
execdir=exec
; allow write access log
log=off
; allow to load library automatically from its directory
autoload=on
; allow php to be executed in public directory
php=on
; show php error message
error=on

; route
[route]
; path to file
; <path>=<file>
test/=test.php
; test/=../private/free.php
public/=

; constant
[constant]
MIA_COMPILED=261030.0631

